<text x="40" y="36" class="serif" style="font-size:20px;font-weight:600">三代生成范式：写、擦、流</text><text x="40" y="60" class="muted" style="font-size:12.5px">同一个目标——把「一次一个 token」变成「一次一块 token」；差别在于块内如何消解不确定性</text><rect x="40" y="86" width="300" height="400" rx="12" fill="#e9edf1" stroke="#5b6b7c" stroke-width="1.4"/><text x="190" y="116" text-anchor="middle" style="fill:#5b6b7c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">AR：逐字写</text><rect x="360" y="86" width="300" height="400" rx="12" fill="#f6ead9" stroke="#c05a3e" stroke-width="1.4"/><text x="510" y="116" text-anchor="middle" style="fill:#c05a3e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">DiffusionGemma：整块擦</text><rect x="680" y="86" width="300" height="400" rx="12" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1.4"/><text x="830" y="116" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">FlowGemma：整块流</text><rect x="130" y="140" width="120" height="32" rx="6" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1"/><text x="190" y="161" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">今天</text><path d="M 190 172 L 190 184" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="130" y="184" width="120" height="32" rx="6" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1"/><text x="190" y="205" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">河流</text><path d="M 190 216 L 190 228" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="130" y="228" width="120" height="32" rx="6" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1"/><text x="190" y="249" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">把</text><path d="M 190 260 L 190 272" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="130" y="272" width="120" height="32" rx="6" fill="#fffdf8" stroke="#1f6f68" stroke-width="2"/><text x="190" y="293" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">墨</text><path d="M 190 304 L 190 316" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="130" y="316" width="120" height="32" rx="6" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1"/><text x="190" y="337" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">送</text><path d="M 190 348 L 190 360" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="130" y="360" width="120" height="32" rx="6" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1"/><text x="190" y="381" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:400">到</text><text x="190" y="414" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">每 forward 只提交 1 个 token</text><text x="190" y="432" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">O(L) 次串行前向</text>