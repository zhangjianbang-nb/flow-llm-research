"212" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="390" y="248" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="430" y="248" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="470" y="248" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="510" y="248" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="550" y="248" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="590" y="248" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="390" y="284" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="430" y="284" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="470" y="284" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="510" y="284" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="550" y="284" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="590" y="284" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="390" y="320" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="430" y="320" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="470" y="320" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="510" y="320" width="32" height="26" rx="4" fill="#d9c9b8" stroke="#c05a3e" stroke-width="0.9" opacity="0.7"/><rect x="550" y="320" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><rect x="590" y="320" width="32" height="26" rx="4" fill="#fffdf8" stroke="#c05a3e" stroke-width="0.9" opacity="1"/><text x="510" y="368" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">256-token 画布，块内双向</text><text x="510" y="386" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">最多 N=48 步去噪，平均约 12 步</text><text x="510" y="404" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">块间因果，前缀可 KV cache</text><circle cx="730" cy="160" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><circle cx="730" cy="194" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><circle cx="730" cy="228" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><circle cx="730" cy="262" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><circle cx="730" cy="296" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><circle cx="730" cy="330" r="9" fill="#dfe8e5" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="148" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="182" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="216" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="250" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="284" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><rect x="880" y="318" width="70" height="26" rx="5" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><path d="M 742 160 C 800 160, 820 161, 876 161" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><path d="M 742 194 C 800 194, 820 195, 876 195" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><path d="M 742 228 C 800 228, 820 229, 876 229" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><path d="M 742 262 C 800 262, 820 263, 876 263" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><path d="M 742 296 C 800 296, 820 297, 876 297" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><path d="M 742 330 C 800 330, 820 331, 876 331" stroke="#1f6f68" stroke-width="1.2" fill="none" opacity=".7"/><text x="730" y="142" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">噪声</text><text x="915" y="142" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">词嵌入 → token</text><text x="830" y="386" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">块大小 B=16，K=1–4 步</text><text x="830" y="404" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">连续速度场联合传输整块</text><text x="830" y="422" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">前缀 KV cache 跨步复用</text><rect x="40" y="502" width="940" height="40" rx="10" fill="#f3ecd9" stroke="#b8892f" stroke-width="1"/><text x="510" y="527" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:600">共同目标：块级并行提交 + 因果前缀 + 用 AR 能力验证草稿</text>
</svg>