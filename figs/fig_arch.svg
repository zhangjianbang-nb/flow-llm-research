<text x="40" y="36" class="serif" style="font-size:20px;font-weight:600">FlowGemma 提案：MoE 骨干上的块级连续流</text><text x="40" y="60" class="muted" style="font-size:12.5px">左侧训练架构，右侧推理循环；虚线表示块间循环</text><rect x="30" y="84" width="760" height="610" rx="14" fill="#fffdf8" stroke="#cfc8b8"/><text x="50" y="112" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:14px;font-weight:600">训练时：一个骨干，两个头</text><rect x="50" y="130" width="150" height="56" rx="9" fill="#fffdf8" stroke="#5b6b7c" stroke-width="1.3"/><text x="125" y="154" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">前缀 tokens</text><text x="125" y="172" text-anchor="middle" class="muted" style="font-size:11px">c ∈ V^N</text><rect x="240" y="130" width="180" height="56" rx="9" fill="#e9edf1" stroke="#5b6b7c" stroke-width="1.3"/><text x="330" y="154" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">共享词嵌入 E</text><text x="330" y="172" text-anchor="middle" class="muted" style="font-size:11px">范数冻结，只学方向</text><path d="M 200 158 L 238 158" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="50" y="220" width="150" height="56" rx="9" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1.3"/><text x="125" y="244" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">噪声块 x_t</text><text x="125" y="262" text-anchor="middle" class="muted" style="font-size:11px">x_t ∈ R^{B×d}</text><rect x="50" y="300" width="150" height="56" rx="9" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1.3"/><text x="125" y="324" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">token 时间 τ(t)</text><text x="125" y="342" text-anchor="middle" class="muted" style="font-size:11px">adaLN 条件</text><rect x="50" y="380" width="150" height="56" rx="9" fill="#f3ecd9" stroke="#b8892f" stroke-width="1.3"/><text x="125" y="404" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">前缀 KV cache</text><text x="125" y="422" text-anchor="middle" class="muted" style="font-size:11px">与块状态无关</text><rect x="240" y="210" width="360" height="250" rx="12" fill="#fffdf8" stroke="#1f6f68" stroke-width="1.6"/><text x="420" y="236" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">MoE Transformer × L</text><text x="420" y="256" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">Router top-2 · 128 experts</text><circle cx="280" cy="282" r="8" fill="#f3ecd9" stroke="#1f6f68" stroke-width="1"/><circle cx="318" cy="282" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="356" cy="282" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="394" cy="282" r="8" fill="#f3ecd9" stroke="#1f6f68" stroke-width="1"/><circle cx="432" cy="282" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="470" cy="282" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="508" cy="282" r="8" fill="#f3ecd9" stroke="#1f6f68" stroke-width="1"/><circle cx="546" cy="282" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="280" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="318" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="356" cy="308" r="8" fill="#f3ecd9" stroke="#1f6f68" stroke-width="1"/><circle cx="394" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="432" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="470" cy="308" r="8" fill="#f3ecd9" stroke="#1f6f68" stroke-width="1"/><circle cx="508" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><circle cx="546" cy="308" r="8" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><text x="270" y="350" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">注意力掩码</text><rect x="270" y="360" width="120" height="70" rx="6" fill="#fffdf8" stroke="#5b6b7c"/><rect x="278" y="368" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="304" y="368" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="330" y="368" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="356" y="368" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="278" y="383" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="304" y="383" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="330" y="383" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="356" y="383" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="278" y="398" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="304" y="398" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="330" y="398" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="356" y="398" width="22" height="11" rx="2" fill="#fffdf8" stroke="#5b6b7c" stroke-width=".7"/><rect x="278" y="413" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="304" y="413" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="330" y="413" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><rect x="356" y="413" width="22" height="11" rx="2" fill="#e9edf1" stroke="#5b6b7c" stroke-width=".7"/><text x="330" y="445" text-anchor="middle" style="fill:#5b6b7c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:400">前缀：因果</text><rect x="420" y="360" width="120" height="70" rx="6" fill="#fffdf8" stroke="#1f6f68"/><rect x="428" y="368" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="454" y="368" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="480" y="368" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="506" y="368" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="428" y="383" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="454" y="383" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="480" y="383" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="506" y="383" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="428" y="398" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="454" y="398" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="480" y="398" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="506" y="398" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="428" y="413" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="454" y="413" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="480" y="413" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><rect x="506" y="413" width="22" height="11" rx="2" fill="#e8f0ee" stroke="#1f6f68" stroke-width=".7"/><text x="480" y="445" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:400">块内：双向</text><path d="M 200 158 L 238 250" stroke="#5b6b7c" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><path d="M 200 248 L 238 280" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><path d="M 200 328 L 238 310" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><path d="M 200 408 L 238 400" stroke="#b8892f" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="650" y="220" width="120" height="62" rx="9" fill="#e9edf1" stroke="#5b6b7c" stroke-width="1.3"/><text x="710" y="247" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">AR head</text><text x="710" y="265" text-anchor="middle" class="muted" style="font-size:11px">预测 c^{i+1}</text><rect x="650" y="310" width="120" height="62" rx="9" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1.3"/><text x="710" y="337" text-anchor="middle" class="t" style="font-size:14px;font-weight:600">Flow 头 D_t</text><text x="710" y="355" text-anchor="middle" class="muted" style="font-size:11px">每位置词表分布</text><path d="M 600 250 L 648 250" stroke="#5b6b7c" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><path d="M 600 340 L 648 340" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="50" y="480" width="720" height="80" rx="10" fill="#f3ecd9" stroke="#b8892f"/><text x="410" y="505" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:13px;font-weight:600">联合训练目标</text><text x="410" y="528" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">L = CE_AR(prefix) + CE_denoise(block) + λ·MSE(E·D_t, E_y) + μ·KL(flow-map)</text><text x="410" y="548" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:400">AR 损失保留预训练能力；去噪损失学联合速度；flow-map KL 把多步压成少步</text><text x="50" y="610" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">三个不可省略的选择：</text><text x="50" y="632" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">① 块内双向注意力：让后面的 token 也能纠正前面的 token</text><text x="50" y="650" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">② 异步 token 时间：让靠左的 token 先走，匹配文本的方向性</text><text x="50" y="668" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">③ 前缀 KV 与块状态解耦：跨去噪步、跨块复用，才有吞吐收益</text><rect x="810" y="84" width="300" height="610" rx="14" fill="#e8f0ee" stroke="#1f6f68"/><text x="960" y="112" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:14px;font-weight:600">推理时：块级并行 + AR 验证</text><rect x="830" y="140" width="260" height="58" rx="9" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1.3"/><text x="960" y="165" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">x₀ ~ N(0, σ²I)</text><text x="960" y="183" text-anchor="middle" class="muted" style="font-size:10.5px">整块噪声</text><path d="M 960 198 L 960 216" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arrT)"/><rect x="830" y="216" width="260" height="58" rx="9" fill="#fffdf8" stroke="#1f6f68" stroke-width="1.3"/><text x="960" y="241" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">K 步 Euler / 一步 FlowMap</text><text x="960" y="259" text-anchor="middle" class="muted" style="font-size:10.5px">连续传输到词嵌入</text><path d="M 960 274 L 960 292" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arrT)"/><rect x="830" y="292" width="260" height="58" rx="9" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1.3"/><text x="960" y="317" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">草稿块 ŷ（B tokens）</text><text x="960" y="335" text-anchor="middle" class="muted" style="font-size:10.5px">每位置 argmax</text><path d="M 960 350 L 960 368" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arrT)"/><rect x="830" y="368" width="260" height="58" rx="9" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1.3"/><text x="960" y="393" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">AR 验证器（同一模型）</text><text x="960" y="411" text-anchor="middle" class="muted" style="font-size:10.5px">最长通过前缀 a</text><path d="M 960 426 L 960 444" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arrT)"/><rect x="830" y="444" width="260" height="58" rx="9" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1.3"/><text x="960" y="469" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">提交 a 个 token</text><text x="960" y="487" text-anchor="middle" class="muted" style="font-size:10.5px">追加 KV cache</text><path d="M 960 502 L 960 520" stroke="#1f6f68" stroke-width="1.6" fill="none" marker-end="url(#arrT)"/><rect x="830" y="520" width="260" height="58" rx="9" fill="#fffdf8" stroke="#cfc8b8" stroke-width="1.3"/><text x="960" y="545" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">下一块</text><text x="960" y="563" text-anchor="middle" class="muted" style="font-size:10.5px">前缀增长，循环</text><text x="830" y="610" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11px;font-weight:400">TPF ≈ 接受长度 a</text><text x="830" y="628" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11px;font-weight:400">KV 复用：前缀 K/V 与块状态无关</text><text x="830" y="646" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11px;font-weight:400">质量优先：a 小则回退 1 token 或加 NFE</text><text x="830" y="664" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11px;font-weight:400">吞吐优先：一步 FlowMap + 置信阈值</text><path d="M 1092 578 L 1092 150" stroke="#1f6f68" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#arrT)"/>
</svg>