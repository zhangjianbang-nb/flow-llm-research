<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" role="img" aria-label="FlowGemma 研究路线图">
<title>FlowGemma 研究路线图</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6f6a60"/>
  </marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6f68"/>
  </marker>
  
</defs>
<style>
  .t{fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif}
  .muted{fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif}
  .serif{fill:#2a2723;font-family:'Songti SC','Noto Serif SC',Georgia,serif}
  .mono{fill:#2a2723;font-family:'SF Mono',Menlo,monospace}
</style>
<text x="40" y="36" class="serif" style="font-size:20px;font-weight:600">一条可执行的 24 个月路线</text><text x="40" y="60" class="muted" style="font-size:12.5px">每阶段都有明确的 Go/No-Go 门槛；不达标就转向离散流、MTP 或混合 AR，而不是硬扛</text><rect x="50" y="90" width="280" height="270" rx="12" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1.5"/><text x="68" y="120" text-anchor="start" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">E1 · 0–6 月</text><text x="68" y="142" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">0.5B 稠密对照</text><text x="68" y="174" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 4 个去噪器臂：离散 / 对角 / 联合 / 异步</text><text x="68" y="202" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 20B tokens，块 4/8/16</text><text x="68" y="230" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 指标：Gen PPL、IFEval/GSM8K/HumanEval</text><text x="68" y="258" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 诊断：非法混合率、TPF、显存</text><rect x="68" y="290" width="244" height="44" rx="8" fill="#fffdf8" stroke="#1f6f68" stroke-width="1"/><text x="190" y="310" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:600">门槛：N≤4 时联合比对角高 ≥5 分</text><text x="190" y="326" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10px;font-weight:400">不达标 → 止损/转向</text><rect x="360" y="90" width="280" height="270" rx="12" fill="#f3ecd9" stroke="#b8892f" stroke-width="1.5"/><text x="378" y="120" text-anchor="start" style="fill:#b8892f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">E2 · 6–12 月</text><text x="378" y="142" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">8B MoE 流适配</text><text x="378" y="174" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 8B total / 2B active，30B tokens</text><text x="378" y="202" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 从 AR 检查点适配，块 16/32</text><text x="378" y="230" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 对照：AR SFT、MTP、离散扩散、Lafa</text><text x="378" y="258" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 指标：质量、TPS、batch 1/8/32</text><rect x="378" y="290" width="244" height="44" rx="8" fill="#fffdf8" stroke="#b8892f" stroke-width="1"/><text x="500" y="310" text-anchor="middle" style="fill:#b8892f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:600">门槛：质量 ≥ AR−1.5，TPS ≥2×</text><text x="500" y="326" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10px;font-weight:400">不达标 → 止损/转向</text><rect x="670" y="90" width="280" height="270" rx="12" fill="#f6ead9" stroke="#c05a3e" stroke-width="1.5"/><text x="688" y="120" text-anchor="start" style="fill:#c05a3e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:15px;font-weight:600">E3 · 12–24 月</text><text x="688" y="142" text-anchor="start" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">少步 + 自投机</text><text x="688" y="174" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· FlowMap 蒸馏到 1–2 步</text><text x="688" y="202" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· AR 验证器 + 置信回退</text><text x="688" y="230" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 长上下文 32K、多模态接口</text><text x="688" y="258" text-anchor="start" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">· 指标：接受率、TPF、p99、$/1M tok</text><rect x="688" y="290" width="244" height="44" rx="8" fill="#fffdf8" stroke="#c05a3e" stroke-width="1"/><text x="810" y="310" text-anchor="middle" style="fill:#c05a3e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:600">门槛：接受率 ≥70%，TPS ≥2.5×</text><text x="810" y="326" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10px;font-weight:400">不达标 → 止损/转向</text><path d="M 330 220 L 358 220" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><path d="M 640 220 L 668 220" stroke="#6f6a60" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect x="50" y="386" width="900" height="34" rx="8" fill="#e9edf1" stroke="#5b6b7c"/><text x="500" y="408" text-anchor="middle" style="fill:#5b6b7c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:600">并行工程线：KV cache 布局、adaLN 融合、专家并行 all-to-all、投机验证融合内核</text>
</svg>