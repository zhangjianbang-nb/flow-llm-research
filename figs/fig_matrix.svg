<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" role="img" aria-label="流语言模型分类地图">
<title>流语言模型分类地图</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6f6a60"/>
  </marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f6f68"/>
  </marker>
  
</defs>
<style>
  .t{fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif}
  .muted{fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif}
  .serif{fill:#2a2723;font-family:'Songti SC','Noto Serif SC',Georgia,serif}
  .mono{fill:#2a2723;font-family:'SF Mono',Menlo,monospace}
</style>
<text x="40" y="36" class="serif" style="font-size:20px;font-weight:600">把「流」放回地图：状态空间 × 块内耦合</text><text x="40" y="60" class="muted" style="font-size:12.5px">横轴是状态空间，纵轴是块内是否联合建模；位置是示意，不是严格互斥的分类</text><rect x="150" y="110" width="640" height="420" rx="12" fill="#fffdf8" stroke="#cfc8b8"/><line x1="470" y1="110" x2="470" y2="530" stroke="#cfc8b8" stroke-width="1" stroke-dasharray="5 5"/><line x1="150" y1="320" x2="790" y2="320" stroke="#cfc8b8" stroke-width="1" stroke-dasharray="5 5"/><text x="470" y="94" text-anchor="middle" style="fill:#c05a3e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">离散状态（one-hot / 硬提交）</text><text x="470" y="558" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">连续状态（embedding / 软传输）</text><text x="132" y="215" text-anchor="middle" transform="rotate(-90 132 215)" style="fill:#5b6b7c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">因子化（各位置独立）</text><text x="132" y="425" text-anchor="middle" transform="rotate(-90 132 425)" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">联合（看整块）</text><text x="310" y="140" text-anchor="middle" style="fill:#c05a3e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">离散 + 因子化</text><rect x="160" y="160" width="300" height="26" rx="6" fill="#f6ead9" stroke="#c05a3e" stroke-width="1"/><text x="310" y="178" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">MDLM / Dream / LLaDA</text><rect x="160" y="194" width="300" height="26" rx="6" fill="#f6ead9" stroke="#c05a3e" stroke-width="1"/><text x="310" y="212" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">DiffusionGemma（块内因子化）</text><rect x="160" y="228" width="300" height="26" rx="6" fill="#f6ead9" stroke="#c05a3e" stroke-width="1"/><text x="310" y="246" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">FS-DFM（step-aware）</text><rect x="160" y="262" width="300" height="26" rx="6" fill="#f6ead9" stroke="#c05a3e" stroke-width="1"/><text x="310" y="280" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">Logit-KL / 一般离散路径</text><text x="630" y="140" text-anchor="middle" style="fill:#b8892f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">离散 + 联合（少量）</text><rect x="480" y="160" width="300" height="26" rx="6" fill="#f3ecd9" stroke="#b8892f" stroke-width="1"/><text x="630" y="178" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">Transition Matching（统一框架）</text><text x="630" y="222" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:400">离散流的联合后验仍少见；</text><text x="630" y="240" text-anchor="middle" style="fill:#6f6a60;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:10.5px;font-weight:400">多数实现按位置因子化。</text><text x="310" y="350" text-anchor="middle" style="fill:#5b6b7c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">连续 + 因子化</text><rect x="160" y="370" width="300" height="26" rx="6" fill="#e9edf1" stroke="#5b6b7c" stroke-width="1"/><text x="310" y="388" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">对角流（本报告 toy 对照）</text><rect x="160" y="404" width="300" height="26" rx="6" fill="#e9edf1" stroke="#5b6b7c" stroke-width="1"/><text x="310" y="422" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">逐位置独立去噪</text><text x="630" y="328" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">★ 本报告主张：连续 + 联合</text><text x="630" y="352" text-anchor="middle" style="fill:#1f6f68;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:12px;font-weight:600">连续 + 联合</text><rect x="480" y="372" width="300" height="26" rx="6" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><text x="630" y="390" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">FMLM / FMLM⁺</text><rect x="480" y="406" width="300" height="26" rx="6" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><text x="630" y="424" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">Lafa（block-bidirectional）</text><rect x="480" y="440" width="300" height="26" rx="6" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><text x="630" y="458" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">LangFlow / RePlaid</text><rect x="480" y="474" width="300" height="26" rx="6" fill="#e8f0ee" stroke="#1f6f68" stroke-width="1"/><text x="630" y="492" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">FlowGemma（本报告提案）</text><rect x="40" y="560" width="860" height="38" rx="9" fill="#f3ecd9" stroke="#b8892f"/><text x="470" y="584" text-anchor="middle" style="fill:#2a2723;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif;font-size:11.5px;font-weight:400">注意：连续不等于联合；只把状态变连续、却仍逐位置独立去噪，会得到「自信的错」（见玩具实验）。</text>
</svg>